name: Recuperar historial anterior
on:
  workflow_dispatch:
    inputs:
      desde:
        description: 'Fecha de inicio (AAAA-MM-DD)'
        required: true
        default: '2026-08-01'
      hasta:
        description: 'Fecha final (AAAA-MM-DD). Vacío = hoy'
        required: false
permissions:
  contents: write
concurrency:
  group: actualizar
  cancel-in-progress: false
jobs:
  rellenar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python rellenar.py "$DESDE" "$HASTA"
        env:
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
      - name: Guardar historial recuperado
        run: |
          git config user.name "robot-meteo"
          git config user.email "robot-meteo@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Historial recuperado" && git push)
