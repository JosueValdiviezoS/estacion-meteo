name: Actualizar datos de la estación
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: actualizar
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python actualizar.py
      - name: Guardar lecturas nuevas
        run: |
          git config user.name "robot-meteo"
          git config user.email "robot-meteo@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Nuevas lecturas" && git push)
